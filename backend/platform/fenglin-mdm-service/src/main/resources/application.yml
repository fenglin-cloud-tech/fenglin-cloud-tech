server:
  max-http-request-header-size: 64KB
  port: ${FENGLIN_MDM_PORT:18110}

spring:
  application:
    name: fenglin-mdm-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${FENGLIN_MDM_DB_URL:jdbc:postgresql://localhost:5432/fenglin_mdm?currentSchema=fenglin_mdm}
    username: ${FENGLIN_MDM_DB_USER:fenglin}
    password: ${FENGLIN_MDM_DB_PASSWORD:fenglin_dev}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 2
      connection-init-sql: SET ROLE fl_mdm_app
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
