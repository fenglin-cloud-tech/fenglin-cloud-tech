server:
  port: 18084
  # 网关透传的 Authorization + X-Permissions 合计超过 Tomcat 默认 8KB，调大避免 400
  max-http-request-header-size: 16KB

spring:
  application:
    name: fenglin-workflow-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${FENGLIN_DB_URL:jdbc:postgresql://localhost:5432/fenglin_hub?currentSchema=fenglin_hub}
    username: ${FENGLIN_DB_USER:fenglin}
    password: ${FENGLIN_DB_PASSWORD:fenglin_dev}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET ROLE fl_app
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

flowable:
  database-schema-update: false
  async-executor-activate: false
  history-level: full
  idm:
    enabled: false
  eventregistry:
    enabled: false

fenglin:
  audit:
    endpoint: ${FENGLIN_AUDIT_ENDPOINT:http://localhost:18087/internal/v1/audit/logs}
  workflow:
    callback:
      connect-timeout: PT2S
      read-timeout: PT5S
      max-retry: 3
      retry-backoff: PT0.2S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
