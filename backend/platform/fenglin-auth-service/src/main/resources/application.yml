server:
  port: 18081
  # 网关透传的 Authorization + X-Permissions 合计超过 Tomcat 默认 8KB；管理员令牌约 17KB，调大避免 431
  max-http-request-header-size: 64KB

spring:
  application:
    name: fenglin-auth-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${FENGLIN_DB_URL:jdbc:postgresql://localhost:5432/fenglin_hub?currentSchema=fenglin_hub}
    username: ${FENGLIN_DB_USER:fenglin}
    password: ${FENGLIN_DB_PASSWORD:fenglin_dev}
    hikari:
      maximum-pool-size: 10
      # 以非属主角色执行，确保 RLS 对应用连接生效
      connection-init-sql: SET ROLE fl_app
  flyway:
    # 平台库迁移唯一所有者是 fenglin-hub-migrations
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

fenglin:
  auth:
    issuer: ${FENGLIN_AUTH_ISSUER:https://hub.fenglincloud.com}
    key-id: ${FENGLIN_AUTH_KEY_ID:hub-dev-1}
    access-token-ttl: PT2H
    refresh-token-ttl: P7D
    max-fail-count: 5
    lock-duration: PT15M
    password-max-age-days: 90
    # 活跃 refresh token 过期后保留 7 天再物理删除
    expired-token-retention: P7D
    token-janitor-batch-size: 5000
    token-janitor-cron: "0 30 3 * * *"
    # refresh token 并发轮换宽限期，期间复用按并发刷新处理，不误杀会话
    refresh-grace: PT10S
  audit:
    endpoint: ${FENGLIN_AUDIT_ENDPOINT:http://localhost:18087/internal/v1/audit/logs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

info:
  app:
    name: ${spring.application.name}
