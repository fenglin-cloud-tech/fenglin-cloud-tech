server:
  port: 18082
  # 网关透传的 Authorization + X-Permissions 合计超过 Tomcat 默认 8KB；管理员令牌约 17KB，调大避免 400
  max-http-request-header-size: 64KB

spring:
  application:
    name: fenglin-iam-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${FENGLIN_DB_URL:jdbc:postgresql://localhost:5432/fenglin_hub?currentSchema=fenglin_hub}
    username: ${FENGLIN_DB_USER:fenglin}
    password: ${FENGLIN_DB_PASSWORD:fenglin_dev}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET ROLE fl_app
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

fenglin:
  audit:
    endpoint: ${FENGLIN_AUDIT_ENDPOINT:http://localhost:18087/internal/v1/audit/logs}
  crypto:
    # 本地/测试密钥，生产由 KMS 注入
    data-key-base64: ${FENGLIN_CRYPTO_DATA_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
