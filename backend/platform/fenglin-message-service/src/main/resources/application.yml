server:
  # gateway injects large permission headers (PLAT-10 stopgap)
  max-http-request-header-size: 64KB
  port: 18085

spring:
  application:
    name: fenglin-message-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${FENGLIN_DB_URL:jdbc:postgresql://localhost:5432/fenglin_hub?currentSchema=fenglin_hub}
    username: ${FENGLIN_DB_USER:fenglin}
    password: ${FENGLIN_DB_PASSWORD:fenglin_dev}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 2
      connection-init-sql: SET ROLE fl_app
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

fenglin:
  db:
    ddl:
      # 分区 DDL 独立连接：fl_login_ddl + SET ROLE fl_ddl_owner，口令只从用户级环境变量注入，不落仓库
      url: ${FENGLIN_DB_URL:jdbc:postgresql://localhost:5432/fenglin_hub?currentSchema=fenglin_hub}
      username: ${FL_LOGIN_DDL_USER:fl_login_ddl}
      password: ${FL_LOGIN_DDL_PASSWORD:}
      role: fl_ddl_owner
      # 启动自检不通过即退出；仅集成测试关闭
      self-check-enabled: ${FENGLIN_DDL_SELF_CHECK_ENABLED:true}
  audit:
    endpoint: ${FENGLIN_AUDIT_ENDPOINT:http://localhost:18087/internal/v1/audit/logs}
  message:
    dedup-window: PT24H
    max-retry: 6
    retry-interval: PT30S
    partition-maintenance-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
