server:
  port: 18087

spring:
  application:
    name: fenglin-audit-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${FENGLIN_DB_URL:jdbc:postgresql://localhost:5432/fenglin_hub?currentSchema=fenglin_hub}
    username: ${FENGLIN_DB_USER:fenglin}
    password: ${FENGLIN_DB_PASSWORD:fenglin_dev}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET ROLE fl_app
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

fenglin:
  audit:
    # 哈希链开关：开启后审计日志与链记录同事务写入，链失败则审计落库失败
    chain:
      enabled: ${FENGLIN_AUDIT_CHAIN_ENABLED:true}
    # 启动补建当月/下月审计分区，每月滚动补建下月；由 DBA 统一管理分区时可关闭
    partition-maintenance-enabled: ${FENGLIN_AUDIT_PARTITION_ENABLED:true}
    partition-maintenance-cron: "0 5 1 1 * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
