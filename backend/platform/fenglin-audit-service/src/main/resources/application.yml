server:
  # gateway injects large permission headers (PLAT-10 stopgap)
  max-http-request-header-size: 64KB
  port: 18087

spring:
  application:
    name: fenglin-audit-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${FENGLIN_DB_URL:jdbc:postgresql://localhost:5432/fenglin_hub?currentSchema=fenglin_hub}
    username: ${FENGLIN_DB_USER:fenglin}
    password: ${FENGLIN_DB_PASSWORD:fenglin_dev}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 2
      connection-init-sql: SET ROLE fl_app
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

fenglin:
  db:
    ddl:
      # 分区 DDL 独立连接：fl_login_ddl + SET ROLE fl_ddl_owner，口令只从用户级环境变量注入，不落仓库
      url: ${FENGLIN_DB_URL:jdbc:postgresql://localhost:5432/fenglin_hub?currentSchema=fenglin_hub}
      username: ${FL_LOGIN_DDL_USER:fl_login_ddl}
      password: ${FL_LOGIN_DDL_PASSWORD:}
      role: fl_ddl_owner
      # 启动自检不通过即退出；仅集成测试关闭
      self-check-enabled: ${FENGLIN_DDL_SELF_CHECK_ENABLED:true}
  audit:
    # 哈希链开关：开启后审计日志与链记录同事务写入，链失败则审计落库失败
    chain:
      enabled: ${FENGLIN_AUDIT_CHAIN_ENABLED:true}
    # 启动补建当月/下月审计分区，每月滚动补建下月；由 DBA 统一管理分区时可关闭
    partition-maintenance-enabled: ${FENGLIN_AUDIT_PARTITION_ENABLED:true}
    partition-maintenance-cron: "0 5 1 1 * *"
    # 审计链完整性定时校验：每小时逐租户校验当月哈希链，断链记录 ERROR 日志
    chain-verify-enabled: ${FENGLIN_AUDIT_CHAIN_VERIFY_ENABLED:true}
    chain-verify-cron: "0 10 * * * *"
    # HUB-API-802 审计导出：轮询 PENDING 任务生成 CSV，文件落本地导出目录
    export-dir: ${FENGLIN_AUDIT_EXPORT_DIR:${java.io.tmpdir}/fenglin-audit-export}
    export-job-enabled: ${FENGLIN_AUDIT_EXPORT_JOB_ENABLED:true}
    export-poll-interval-ms: ${FENGLIN_AUDIT_EXPORT_POLL_INTERVAL_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
