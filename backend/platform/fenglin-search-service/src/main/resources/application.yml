server:
  # gateway injects large permission headers (PLAT-10 stopgap)
  max-http-request-header-size: 64KB
  port: 18088

spring:
  application:
    name: fenglin-search-service
  # actuator ES 健康检查沿用 Boot 自动配置，统一指向实际 ES 端口，避免误判 DOWN
  elasticsearch:
    uris: ${FENGLIN_ES_URI:http://localhost:9201}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${FENGLIN_DB_URL:jdbc:postgresql://localhost:5432/fenglin_hub?currentSchema=fenglin_hub}
    username: ${FENGLIN_DB_USER:fenglin}
    password: ${FENGLIN_DB_PASSWORD:fenglin_dev}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 2
      connection-init-sql: SET ROLE fl_app
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

fenglin:
  audit:
    endpoint: ${FENGLIN_AUDIT_ENDPOINT:http://localhost:18087/internal/v1/audit/logs}
  search:
    # Elasticsearch 8.x 容器（deploy/compose：宿主 9201 映射容器 9200）
    es-uri: ${FENGLIN_ES_URI:http://localhost:9201}
    # 文档索引命名：{index-prefix}_{domain}（检索）与 {index-prefix}_{tenantId}_{indexName}（索引任务）
    index-prefix: hub
    # PLAT-26 一期：云服域内部检索导出（search-service 拉取，不直连业务库）
    service-export-url: ${FENGLIN_SERVICE_EXPORT_URL:http://localhost:18100}
    intelligence-export-url: ${FENGLIN_INTELLIGENCE_EXPORT_URL:http://localhost:18102}
    index-task-job-enabled: ${FENGLIN_SEARCH_INDEX_JOB_ENABLED:true}
    index-task-poll-interval-ms: ${FENGLIN_SEARCH_INDEX_POLL_INTERVAL_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
