# 丰麟云枢入口 Header 容量配置（PLAT-11 / PLAT-14 交付件）
#
# 背景：租户权限以明文码随 X-Permissions 注入，当前最大约 456 条 / 11,182 字节（约 12.3KB），
#       nginx 默认 8KB 头缓冲会在生产入口返回 400/431。应用侧已按 64KB 放宽，入口必须同步放宽。
# 适用：nginx 或基于 nginx 的反向代理（含 ingress-nginx 的自建场景）。
# 交付状态：仅配置片段，需在部署环境应用并 reload；本仓未在真实生产入口验证。
#
# 应用方式：
#   1) 将下面两行放入监听 443/80 的 http 或 server 块；
#   2) nginx -t 校验后执行 nginx -s reload（平滑 reload，不中断连接）；
#   3) 用至少 20KB 的 X-Permissions 请求回归一次（预期 200，而非 400/431）。

client_header_buffer_size 16k;
large_client_header_buffers 4 64k;
