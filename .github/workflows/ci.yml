name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate Flyway migration names
        run: bash scripts/check-flyway-naming.sh

      - name: Build and test
        run: mvn -B -T 4 -f backend/pom.xml clean install -Dtest='!FileFlowIntegrationTest,!SearchIntegrationTest,!OpenApiIntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false

  external-integration:
    runs-on: ubuntu-latest
    services:
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
          MINIO_DEFAULT_BUCKETS: fenglin-files-test
        ports:
          - 9000:9000
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for MinIO and Elasticsearch
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live >/dev/null && break || sleep 2; done
          for i in $(seq 1 60); do curl -sf http://localhost:9200/_cluster/health >/dev/null && break || sleep 2; done

      - name: Run external integration tests
        run: mvn -B -T 4 -f backend/pom.xml -Dtest='FileFlowIntegrationTest,SearchIntegrationTest,OpenApiIntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false test

  common-web-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install shared module
        run: mvn -B -f backend/pom.xml -pl fenglin-common/fenglin-common-web -am install -DskipTests

      - name: Package services without tests
        run: mvn -B -T 4 -f backend/pom.xml -DskipTests package

      - name: Verify common-web handler set
        shell: pwsh
        run: ./scripts/verify-common-web.ps1 -Root .
